rds for 600 Shadow Damage at the same time.</li><ul><li>If Ice Morganthe is defeated, Death Morganthe will take over casting the Shadow Morganthe cheat. If Death Morganthe is defeated, Storm Morganthe will cast it, and finally Balance Morganthe will cast the cheat if all other forms have been defeated.</li></ul><li>Each Morganthe has a Natural Attack, and a special personal attack. The Natural Attack sends spiders to wrap the Wizard in a web. The special attack morphs many spiders into one giant shadow spider (does not do Shadow Damage though). The following is a list of the special personalized attacks:</li><ul><li><a href=\"https://wiki.wizard101central.com/wiki/Spell:Balance_Morganthe_Attack\" target=\"_blank\" rel=\"noopener noreferrer\">Balance Morganthe Attack</a></li><li><a href=\"https://wiki.wizard101central.com/wiki/Spell:Death_Morganthe_Attack\" target=\"_blank\" rel=\"noopener noreferrer\">Death Morganthe Attack</a></li><li><a href=\"https://wiki.wizard101central.com/wiki/Spell:Ice_Morganthe_Attack\" target=\"_blank\" rel=\"noopener noreferrer\">Ice Morganthe Attack</a></li><li><a href=\"https://wiki.wizard101central.com/wiki/Spell:Storm_Morganthe_Attack\" target=\"_blank\" rel=\"noopener noreferrer\">Storm Morganthe Attack</a></li></ul></ul></div>e:[\"$\",\"main\",null,{\"children\":[[\"$\",\"$L1f\",null,{\"worldName\":\"Khrysalis\",\"worldSlug\":\"khrysalis\",\"quests\":[{\"_id\":\"6940dad1f3f6903443307a7a\",\"uuid\":\"kh00100-72f3-ae3d-4c5e-9e2b-405647d55e1f\",\"id\":1,\"area\":\"Wizard City\",\"name\":\"Letters of Light\",\"world\":\"khrysalis\",\"steps\":[{\"type\":\"talk\"},{\"type\":\"talk\"},{\"type\":\"talk\"},{\"type\":\"talk\"}],\"gold\":280,\"nerothon\":{\"world\":\"Wizard City\",\"location\":\"The Commons\",\"storyline\":\"Khrysalis\",\"order\":1,\"types\":[\"Storyline\"],\"level\":null,\"school\":null,\"previousQuests\":[\"Speaker for the Dead\"],\"nextQuests\":[\"Calling the Council\"],\"modifiedAt\":\"2024-12-11T05:39:07Z\"},\"wikiName\":
